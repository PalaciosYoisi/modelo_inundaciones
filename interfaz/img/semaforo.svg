<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" role="img" aria-label="Semáforo con las luces verde, amarilla y roja sobre un río">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2f4a"/><stop offset="1" stop-color="#0d6b7c"/>
    </linearGradient>
    <radialGradient id="luzVerde"><stop offset="0" stop-color="#7cf0aa"/><stop offset="1" stop-color="#2fb86a"/></radialGradient>
    <radialGradient id="luzAmarilla"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f5b82e"/></radialGradient>
    <radialGradient id="luzRoja"><stop offset="0" stop-color="#ff9a9d"/><stop offset="1" stop-color="#e5484d"/></radialGradient>
    <filter id="brillo" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <pattern id="lluvia" width="90" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(14)">
      <line x1="14" y1="8" x2="14" y2="40" stroke="#cdeeff" stroke-opacity=".22" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="60" y1="64" x2="60" y2="104" stroke="#cdeeff" stroke-opacity=".15" stroke-width="1.3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect width="560" height="640" rx="28" fill="url(#fondo)"/>
  <rect width="560" height="640" rx="28" fill="url(#lluvia)"/>
  <!-- cuerpo del semáforo -->
  <rect x="190" y="52" width="180" height="420" rx="40" fill="#07182a" stroke="#1d3d58" stroke-width="4"/>
  <circle cx="280" cy="140" r="52" fill="#e5484d" opacity=".55" filter="url(#brillo)"/>
  <circle cx="280" cy="140" r="42" fill="url(#luzRoja)"/>
  <circle cx="280" cy="262" r="42" fill="url(#luzAmarilla)" opacity=".92"/>
  <circle cx="280" cy="384" r="42" fill="url(#luzVerde)" opacity=".92"/>
  <rect x="268" y="472" width="24" height="70" fill="#07182a"/>
  <!-- río -->
  <path d="M0,540 C90,515 160,565 250,540 S420,505 560,545 L560,640 L0,640 Z" fill="#1d93a6" opacity=".75"/>
  <path d="M0,575 C110,550 190,600 290,575 S450,545 560,580 L560,640 L0,640 Z" fill="#0f6f86" opacity=".9"/>
  <path d="M0,608 C120,590 210,628 320,606 S470,590 560,612 L560,640 L0,640 Z" fill="#0a4d66"/>
</svg>
